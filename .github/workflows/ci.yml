name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore S1Atlas.sln
      - name: Verify S1Atlas.NativeRecovery lockfile
        run: dotnet restore src/S1Atlas.NativeRecovery/S1Atlas.NativeRecovery.csproj --locked-mode
      - name: Build
        run: dotnet build S1Atlas.sln --configuration Release --no-restore
      - name: Format
        run: dotnet format S1Atlas.sln --verify-no-changes --no-restore
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository-hygiene.ps1
      - name: Public content
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}' -BranchName '${{ github.head_ref }}'
          } else {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.before }}'
          }

  tests:
    name: test ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S1Atlas.Core.Tests
            project: tests/S1Atlas.Core.Tests
          - name: S1Atlas.Docs.Tests
            project: tests/S1Atlas.Docs.Tests
          - name: S1Atlas.Extraction.Tests
            project: tests/S1Atlas.Extraction.Tests
          - name: S1Atlas.Indexing.Tests
            project: tests/S1Atlas.Indexing.Tests
          - name: S1Atlas.IntegrationTests
            project: tests/S1Atlas.IntegrationTests
          - name: S1Atlas.Mcp.Tests
            project: tests/S1Atlas.Mcp.Tests
          - name: S1Atlas.NativeRecovery.Tests
            project: tests/S1Atlas.NativeRecovery.Tests
          - name: S1Atlas.Storage.Tests
            project: tests/S1Atlas.Storage.Tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Report disk layout
        shell: pwsh
        run: |
          # AT-61: test temp I/O cost depends on which volume backs each
          # directory. TEMP/TMP default to the C: user profile; RUNNER_TEMP
          # and the workspace live on the runner's temp disk.
          Write-Output "workspace=${{ github.workspace }}"
          Write-Output "runner_temp=${{ runner.temp }}"
          Write-Output "default_temp=$env:TEMP"
          Get-Volume | Format-Table DriveLetter, FileSystemLabel, DriveType
      - name: Prepare test temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/s1atlas-test-temp" | Out-Null
      - name: Exclude test paths from Windows Defender
        shell: pwsh
        run: |
          # AT-61, CI-only: real-time antivirus scanning of per-test SQLite
          # atlases and freshly built DLLs is a suspected cause of CI-only
          # test slowness. Exclude the workspace and runner temp directories
          # from scanning for this job. Never applied to developer machines.
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"
      - name: Test
        shell: pwsh
        env:
          # AT-61: tests build their SQLite atlases under Path.GetTempPath(),
          # which reads TMP/TEMP. Point them at the runner temp disk instead
          # of the default C: user profile temp directory.
          TEMP: ${{ runner.temp }}/s1atlas-test-temp
          TMP: ${{ runner.temp }}/s1atlas-test-temp
        run: dotnet test ${{ matrix.project }} --configuration Release --verbosity normal --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory TestResults
      - name: Timing summary
        if: always()
        shell: pwsh
        run: ./scripts/summarize-test-timings.ps1 -ResultsDirectory TestResults
      - name: Upload test results
        if: always() && hashFiles('TestResults/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults
          retention-days: 14

  build-test:
    runs-on: ubuntu-latest
    needs: [checks, tests]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true
      - name: Timing summary
        if: always()
        shell: pwsh
        run: ./scripts/summarize-test-timings.ps1 -ResultsDirectory TestResults
      - name: Verify pipeline
        if: always()
        shell: pwsh
        run: |
          $checks = '${{ needs.checks.result }}'
          $tests = '${{ needs.tests.result }}'
          Write-Output "checks=$checks tests=$tests"
          if ($checks -ne 'success' -or $tests -ne 'success') { exit 1 }
