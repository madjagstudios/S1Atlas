name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore S1Atlas.sln --locked-mode
      - name: Build
        run: dotnet build S1Atlas.sln --configuration Release --no-restore
      - name: Installable tools smoke
        shell: pwsh
        run: |
          $packDir = "$env:RUNNER_TEMP/at77-packages"
          $toolDir = "$env:RUNNER_TEMP/at77-tools"
          $env:S1ATLAS_HOME = "$env:RUNNER_TEMP/at77-home"
          dotnet pack S1Atlas.sln --configuration Release --no-restore --output $packDir
          $nupkgCount = @(Get-ChildItem $packDir -Filter *.nupkg).Count
          Write-Output "nupkgs=$nupkgCount"
          if ($nupkgCount -ne 2) { throw "expected exactly 2 tool packages, got $nupkgCount" }
          dotnet tool install S1Atlas.Cli --tool-path $toolDir --add-source $packDir
          dotnet tool install S1Atlas.Mcp --tool-path $toolDir --add-source $packDir
          $expected = (Select-String '^## \[(\d+\.\d+\.\d+)\]' CHANGELOG.md | Select-Object -First 1).Matches[0].Groups[1].Value
          $cliVersion = (& "$toolDir/s1atlas.exe" --version).Trim()
          Write-Output "s1atlas --version actual='$cliVersion' expected='$expected'"
          if ($cliVersion -ne $expected) { throw "s1atlas --version mismatch: actual='$cliVersion' expected='$expected'" }
          $mcpVersion = (& "$toolDir/s1atlas-mcp.exe" --version).Trim()
          Write-Output "s1atlas-mcp --version actual='$mcpVersion' expected='$expected'"
          if ($mcpVersion -ne $expected) { throw "s1atlas-mcp --version mismatch: actual='$mcpVersion' expected='$expected'" }
          & "$toolDir/s1atlas.exe" tools status | Out-Null
          $statusExit = $LASTEXITCODE
          Write-Output "s1atlas tools status exit=$statusExit"
          if ($statusExit -ne 0) { throw "installed s1atlas tools status failed with exit $statusExit" }
          & "$toolDir/s1atlas-mcp.exe" bogus-arg 2>$null | Out-Null
          $usageExit = $LASTEXITCODE
          Write-Output "s1atlas-mcp bogus-arg exit=$usageExit"
          if ($usageExit -ne 2) { throw "installed s1atlas-mcp usage exit code mismatch: actual=$usageExit expected=2" }
          $serveOut = "$env:RUNNER_TEMP/at88-serve.log"
          $serveErr = "$env:RUNNER_TEMP/at88-serve.err"
          $serve = Start-Process "$toolDir/s1atlas.exe" -ArgumentList 'serve','--port','0' -NoNewWindow -PassThru -RedirectStandardOutput $serveOut -RedirectStandardError $serveErr
          try {
            $url = $null
            for ($i = 0; $i -lt 120 -and $url -eq $null; $i++) {
              Start-Sleep -Milliseconds 250
              $line = Select-String 'S1Atlas serve listening on (\S+)' $serveOut -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($line) { $url = $line.Matches[0].Groups[1].Value }
            }
            if ($url -eq $null) { throw "installed s1atlas serve never printed its listening address" }
            Write-Output "serve url=$url"
            $base = $url.TrimEnd('/')
            $status = Invoke-RestMethod ($base + '/api/status') -TimeoutSec 15
            Write-Output ("serve /api/status status=" + $status.status + " authority=" + $status.data.authorityStatus)
            if ($status.status -ne 'resolved') { throw "expected a resolved status envelope, got '$($status.status)'" }
            if ($status.data.authorityStatus -ne 'NoCurrentBuild') { throw "expected NoCurrentBuild on an empty home, got '$($status.data.authorityStatus)'" }
            $landing = Invoke-WebRequest ($base + '/') -TimeoutSec 15
            Write-Output ("serve landing status=" + [int]$landing.StatusCode)
            if ([int]$landing.StatusCode -ne 200) { throw "serve landing failed with status $($landing.StatusCode)" }
          } finally {
            if (-not $serve.HasExited) { Stop-Process -Id $serve.Id -Force }
            if (-not $serve.WaitForExit(15000)) { throw "installed s1atlas serve did not stop" }
          }
          # All assertions passed: exit explicitly so the deliberate nonzero
          # probe exit above cannot fail the step.
          exit 0
      - name: Format
        run: dotnet format S1Atlas.sln --verify-no-changes --no-restore
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository-hygiene.ps1
      - name: Public content
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}' -BranchName '${{ github.head_ref }}'
          } else {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.before }}'
          }

  tests:
    name: test ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S1Atlas.Core.Tests
            project: tests/S1Atlas.Core.Tests
          - name: S1Atlas.Extraction.Tests
            project: tests/S1Atlas.Extraction.Tests
          - name: S1Atlas.Indexing.Tests
            project: tests/S1Atlas.Indexing.Tests
          - name: S1Atlas.IntegrationTests
            project: tests/S1Atlas.IntegrationTests
          - name: S1Atlas.Mcp.Tests
            project: tests/S1Atlas.Mcp.Tests
          - name: S1Atlas.NativeRecovery.Tests
            project: tests/S1Atlas.NativeRecovery.Tests
          - name: S1Atlas.Storage.Tests
            project: tests/S1Atlas.Storage.Tests
          - name: S1Atlas.Web.Tests
            project: tests/S1Atlas.Web.Tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Report disk layout
        shell: pwsh
        run: |
          # AT-61: test temp I/O cost depends on which volume backs each
          # directory. TEMP/TMP default to the C: user profile; RUNNER_TEMP
          # and the workspace live on the runner's temp disk.
          Write-Output "workspace=${{ github.workspace }}"
          Write-Output "runner_temp=${{ runner.temp }}"
          Write-Output "default_temp=$env:TEMP"
          Get-Volume | Format-Table DriveLetter, FileSystemLabel, DriveType
      - name: Prepare test temp directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/s1atlas-test-temp" | Out-Null
      - name: Test
        shell: pwsh
        env:
          # AT-61: tests build their SQLite atlases under Path.GetTempPath(),
          # which reads TMP/TEMP. Point them at the runner temp disk instead
          # of the default C: user profile temp directory.
          TEMP: ${{ runner.temp }}/s1atlas-test-temp
          TMP: ${{ runner.temp }}/s1atlas-test-temp
        run: dotnet test ${{ matrix.project }} --configuration Release -p:RestoreLockedMode=true --verbosity normal --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory TestResults
      - name: Timing summary
        if: always()
        shell: pwsh
        run: ./scripts/summarize-test-timings.ps1 -ResultsDirectory TestResults
      - name: Upload test results
        if: always() && hashFiles('TestResults/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults
          retention-days: 14

  build-test:
    runs-on: ubuntu-latest
    needs: [checks, tests]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true
      - name: Timing summary
        if: always()
        shell: pwsh
        run: ./scripts/summarize-test-timings.ps1 -ResultsDirectory TestResults
      - name: Verify pipeline
        if: always()
        shell: pwsh
        run: |
          $checks = '${{ needs.checks.result }}'
          $tests = '${{ needs.tests.result }}'
          Write-Output "checks=$checks tests=$tests"
          if ($checks -ne 'success' -or $tests -ne 'success') { exit 1 }
