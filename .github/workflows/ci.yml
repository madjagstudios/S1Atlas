name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore S1Atlas.sln
      - name: Verify S1Atlas.NativeRecovery lockfile
        run: dotnet restore src/S1Atlas.NativeRecovery/S1Atlas.NativeRecovery.csproj --locked-mode
      - name: Build
        run: dotnet build S1Atlas.sln --configuration Release --no-restore
      - name: Test
        shell: pwsh
        run: |
          $projects = @(
            'tests/S1Atlas.Core.Tests',
            'tests/S1Atlas.Docs.Tests',
            'tests/S1Atlas.Extraction.Tests',
            'tests/S1Atlas.Indexing.Tests',
            'tests/S1Atlas.IntegrationTests',
            'tests/S1Atlas.Mcp.Tests',
            'tests/S1Atlas.NativeRecovery.Tests',
            'tests/S1Atlas.Storage.Tests'
          )
          $failed = @()
          foreach ($project in $projects) {
            $name = Split-Path $project -Leaf
            dotnet test $project --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=$name.trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          if ($failed.Count -gt 0) {
            Write-Output "Failing test projects: $($failed -join ', ')"
            exit 1
          }
      - name: Timing summary
        if: always()
        shell: pwsh
        run: ./scripts/summarize-test-timings.ps1 -ResultsDirectory TestResults
      - name: Upload test results
        if: always() && hashFiles('TestResults/*.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14
      - name: Format
        run: dotnet format S1Atlas.sln --verify-no-changes --no-restore
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository-hygiene.ps1
      - name: Public content
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}' -BranchName '${{ github.head_ref }}'
          } else {
            ./scripts/verify-public-content.ps1 -BaseRef '${{ github.event.before }}'
          }
