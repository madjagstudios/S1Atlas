name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore S1Atlas.sln
      - name: Build
        run: dotnet build S1Atlas.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test S1Atlas.sln --configuration Release --no-build --verbosity normal
      - name: Format
        run: dotnet format S1Atlas.sln --verify-no-changes --no-restore
      - name: Repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository-hygiene.ps1
